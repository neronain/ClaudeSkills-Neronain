# Environment defaults for this team. Explicit user values and live command output win over this file.
profile_version: 2
language: th

hub:
  orbstack_vm: Autodeploy            # from the Mac: orb -m Autodeploy bash -lc 'cd ~ && lmds …'
  address: 192.168.139.92
  web_console: http://192.168.139.92:8600   # token in ~/.config/lmds/web-token on the hub
  repo: ~/AutoDeployDGXProject       # git main = source of truth, GitHub neronain/AutoDeployDGXProject
  cli: ~/.local/bin/lmds
  run_from: "~"                      # lmds deploy writes ./bundles relative to the current directory
  has_gpu: false

nodes:
  registry: lmds node list           # names, IPs and sites come from the registry, not from this file
  lab_pair:                          # the owner's own stacked pair — safe for experiments
    head: spark-head                 # cluster IP 10.100.152.1
    worker: spark-worker             # cluster IP 10.100.152.2
  customer_sites_read_only: true     # change customer nodes only after the owner agrees

targets:
  single: dgx-spark-single
  stacked: dgx-spark-stacked

memory:
  total_gb: 121
  os_reserve_gb: 12
  usable_gb: 109
